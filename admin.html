<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel · Bacano.cl</title>
<link rel="icon" href="assets/img/favicon.svg?v=2" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000000; --black-2:#0a0a0a; --line:#e4e4e4; --line-d:#232323;
  --paper:#f8f8f8; --gray:#767676; --gray-2:#9e9e9e;
  --red:#000000; --red-2:#1a1a1a; --ok:#000000; --warn:#3d3d3d;
  --r:0px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Inter Tight",Inter,system-ui,sans-serif;background:var(--paper);color:var(--black);font-size:15px}
a{color:inherit}
button{font:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit}
h1,h2,h3,h4{margin:0;line-height:1.2}

/* ---------- Estructura ---------- */
.top{
  position:sticky;top:0;z-index:20;background:var(--black);color:#fff;
  display:flex;align-items:center;gap:14px;padding:12px 20px;flex-wrap:wrap;
}
.top__logo{
  display:block;height:32px;aspect-ratio:1065/456;background:#fff;
  -webkit-mask:url(assets/img/logo-bacano.png) center/contain no-repeat;
          mask:url(assets/img/logo-bacano.png) center/contain no-repeat;
}
.top .sep{flex:1}
.chip{font-size:.72rem;font-weight:700;padding:5px 11px;border-radius:100px;background:#2a2a32;color:#c9c9d2}
.chip.warn{background:#2a2a2a;color:#fff}
.chip.ok{background:#fff;color:#000}

.layout{display:grid;grid-template-columns:214px 1fr;min-height:calc(100vh - 58px)}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
.side{background:var(--black-2);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
@media(max-width:820px){.side{flex-direction:row;overflow-x:auto;padding:10px}}
.side button{
  display:flex;align-items:center;gap:10px;color:#b9b9c3;padding:11px 14px;border-radius:9px;
  font-size:.9rem;font-weight:600;text-align:left;white-space:nowrap;width:100%;
}
.side button:hover{background:#22222a;color:#fff}
.side button.on{background:var(--red);color:#fff}
.side small{color:#5d5d68;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;padding:14px 14px 6px;font-weight:800}
main{padding:26px;max-width:1100px}
@media(max-width:600px){main{padding:16px}}

/* ---------- UI ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:100px;
  background:var(--black);color:#fff;font-weight:700;font-size:.84rem;transition:.15s;border:2px solid var(--black);
}
.btn:hover{transform:translateY(-1px)}
.btn--red{background:var(--red);border-color:var(--red)}
.btn--red:hover{background:var(--red-2);border-color:var(--red-2)}
.btn--gh{background:#fff;color:var(--black);border-color:var(--line)}
.btn--sm{padding:7px 13px;font-size:.76rem}
.btn--ghost{background:transparent;color:var(--black);border-color:var(--line)}
.btn--ghost:hover{background:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px}
.head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.head h2{font-size:1.3rem;font-weight:800}
.head .sep{flex:1}
.muted{color:var(--gray);font-size:.86rem}
.grid2{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.grid3{display:grid;gap:14px;grid-template-columns:repeat(3,1fr)}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}
label.f{display:block;font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;color:var(--gray)}
.in{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 13px;background:#fff}
.in:focus{outline:2px solid var(--red);outline-offset:-1px}
textarea.in{min-height:90px;resize:vertical}
.hint{font-size:.76rem;color:var(--gray);margin-top:5px}

.list{display:grid;gap:10px}
.row{
  display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);
  border-radius:var(--r);padding:11px 14px;
}
.row img{width:56px;height:56px;object-fit:cover;border-radius:8px;background:var(--paper);flex:none}
.row .info{flex:1;min-width:0}
.row .info b{display:block;font-size:.94rem}
.row .info span{font-size:.78rem;color:var(--gray)}
.row .acts{display:flex;gap:6px;flex:none}
.ico{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-size:.9rem}
.ico:hover{background:var(--black);color:#fff;border-color:var(--black)}
.ico.del:hover{background:var(--red);border-color:var(--red)}

.tagline{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tg{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;background:var(--paper);color:var(--gray);padding:3px 8px;border-radius:100px}
.tg.red{background:#f1f1f1;color:var(--red)}

.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.foto{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;position:relative}
.foto img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.foto p{margin:0;padding:7px 9px;font-size:.7rem;word-break:break-all;color:var(--gray)}
.foto .x{position:absolute;top:6px;right:6px;background:rgba(12,12,14,.8);color:#fff;width:24px;height:24px;border-radius:50%}
.foto.pick{cursor:pointer}
.foto.pick:hover{border-color:var(--red);box-shadow:0 0 0 2px #f1f1f1}

.drop{
  border:2px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;background:#fff;
}
.drop.over{border-color:var(--red);background:#f1f1f1}

.log{background:#0c0c0e;color:#c9c9d2;border-radius:10px;padding:14px;font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;max-height:230px;overflow:auto;white-space:pre-wrap}
.log b{color:#7fd8a3}
.log i{color:#ff8f95;font-style:normal}

.toast{
  position:fixed;right:18px;bottom:18px;z-index:60;background:var(--black);color:#fff;padding:13px 18px;
  border-radius:10px;box-shadow:0 18px 40px rgba(0,0,0,.28);font-size:.86rem;border-left:4px solid var(--red-2);
}
.steps{counter-reset:s;display:grid;gap:14px}
.steps li{list-style:none;display:flex;gap:12px;align-items:flex-start;font-size:.9rem}
.steps li::before{
  counter-increment:s;content:counter(s);background:var(--black);color:#fff;width:24px;height:24px;border-radius:50%;
  display:grid;place-items:center;font-size:.74rem;font-weight:800;flex:none;
}
code{background:var(--paper);padding:2px 6px;border-radius:5px;font-size:.85em;border:1px solid var(--line)}
pre.code{background:var(--black);color:#e8e8ee;padding:14px;border-radius:10px;overflow:auto;font-size:.8rem;line-height:1.6}
</style>
</head>
<body>

<div class="top">
  <span class="top__logo" role="img" aria-label="Bacano Estudio Creativo"></span>
  <span class="chip" id="estado">Sin cambios</span>
  <span class="sep"></span>
  <a class="btn btn--ghost btn--sm" style="color:#fff;border-color:#2a2a32" href="index.html?preview=1" target="_blank">👁 Vista previa</a>
  <button class="btn btn--gh btn--sm" onclick="descargarData()">⬇ Descargar data.js</button>
  <button class="btn btn--red btn--sm" onclick="ir('publicar')">🚀 Publicar</button>
</div>

<div class="layout">
  <nav class="side" id="side"></nav>
  <main id="view"></main>
</div>

<script src="assets/js/data.js?v=5"></script>
<script>
/* ============================================================
   PANEL BACANO — estado
   ============================================================ */
const KEY  = "bacano_admin_v1";
const KGH  = "bacano_github";
const clon = o => JSON.parse(JSON.stringify(o));

let S = null, tab = "productos", edit = null, sucio = false;

function semilla(){
  return {
    SITE: clon(SITE), FOTOS: clon(FOTOS), CATEGORIAS: clon(CATEGORIAS),
    PRODUCTOS: clon(PRODUCTOS), TESTIMONIOS: clon(TESTIMONIOS), FAQS: clon(FAQS),
    BIBLIOTECA: (typeof BIBLIOTECA !== "undefined" ? clon(BIBLIOTECA) : [])
  };
}
function cargar(){
  try{
    const g = JSON.parse(localStorage.getItem(KEY));
    S = g && g.PRODUCTOS ? g : semilla();
  }catch(e){ S = semilla(); }
}
function guardar(marcar = true){
  localStorage.setItem(KEY, JSON.stringify(S));
  if(marcar){ sucio = true; estado(); }
}
function estado(){
  const e = document.getElementById("estado");
  e.textContent = sucio ? "● Cambios sin publicar" : "Sin cambios";
  e.className = "chip " + (sucio ? "warn" : "");
}
function toast(msg){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const clp = n => "$" + Number(n || 0).toLocaleString("es-CL");
const slug = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);

/* ============================================================
   NAVEGACIÓN
   ============================================================ */
const TABS = [
  ["productos",   "📦 Productos"],
  ["categorias",  "🗂 Categorías"],
  ["fotos",       "🖼 Fotos"],
  ["sitio",       "⚙️ Datos del sitio"],
  ["testimonios", "💬 Testimonios"],
  ["faqs",        "❓ Preguntas"],
  ["publicar",    "🚀 Publicar contenido"],
  ["versiones",   "📤 Versiones del sitio"],
  ["basedatos",   "🗄 Base de datos"],
  ["ayuda",       "📘 Cómo funciona"]
];
function menu(){
  document.getElementById("side").innerHTML =
    `<small>Contenido</small>` +
    TABS.slice(0,6).map(([k,t]) => `<button class="${tab===k?"on":""}" onclick="ir('${k}')">${t}</button>`).join("") +
    `<small>Sitio</small>` +
    TABS.slice(6).map(([k,t]) => `<button class="${tab===k?"on":""}" onclick="ir('${k}')">${t}</button>`).join("");
}
function ir(k){ tab = k; edit = null; menu(); pintar(); window.scrollTo(0,0); }

function pintar(){
  const v = document.getElementById("view");
  v.innerHTML = ({
    productos:   vProductos, categorias: vCategorias, fotos: vFotos, sitio: vSitio,
    testimonios: vTestimonios, faqs: vFaqs, publicar: vPublicar, versiones: vVersiones,
    basedatos: vBaseDatos, ayuda: vAyuda
  })[tab]();
  if(tab === "versiones") cargarHistorial();
  if(tab === "basedatos") cargarEstadoBD();
}

/* ============================================================
   PRODUCTOS
   ============================================================ */
function vProductos(){
  if(edit !== null) return formProducto();
  return `
  <div class="head">
    <div><h2>Productos</h2><p class="muted" style="margin:4px 0 0">${S.PRODUCTOS.length} en el catálogo · los primeros 8 salen en la home</p></div>
    <span class="sep"></span>
    <button class="btn btn--red" onclick="edit='nuevo';pintar()">+ Nuevo producto</button>
  </div>
  <div class="list">
    ${S.PRODUCTOS.map((p,i) => `
      <div class="row">
        <img src="${esc(p.img)}" alt="" onerror="this.style.opacity=.25">
        <div class="info">
          <b>${esc(p.nombre)}</b>
          <span>${clp(p.precio)} · ${esc(p.unidad)} · ${esc(catNombre(p.cat))}</span>
          <div class="tagline">
            ${(p.flags||[]).map(f => `<span class="tg red">${esc(f)}</span>`).join("")}
            ${i < 8 ? '<span class="tg">en la home</span>' : ""}
          </div>
        </div>
        <div class="acts">
          <button class="ico" title="Subir"   onclick="mover(${i},-1)">↑</button>
          <button class="ico" title="Bajar"   onclick="mover(${i},1)">↓</button>
          <button class="ico" title="Duplicar" onclick="duplicar(${i})">⧉</button>
          <button class="ico" title="Editar"  onclick="edit=${i};pintar()">✎</button>
          <button class="ico del" title="Eliminar" onclick="borrar(${i})">🗑</button>
        </div>
      </div>`).join("")}
  </div>`;
}
const catNombre = s => (S.CATEGORIAS.find(c => c.slug === s) || {}).nombre || s;

function formProducto(){
  const nuevo = edit === "nuevo";
  const p = nuevo
    ? { id:"", nombre:"", cat:S.CATEGORIAS[0]?.slug || "", precio:0, antes:0, unidad:"", img:"",
        flags:[], rating:5, reviews:0, desc:"", specs:[], plazo:"" }
    : S.PRODUCTOS[edit];
  return `
  <div class="head">
    <button class="btn btn--ghost btn--sm" onclick="edit=null;pintar()">← Volver</button>
    <h2>${nuevo ? "Nuevo producto" : "Editar producto"}</h2>
  </div>
  <form class="card" onsubmit="return guardarProducto(event)">
    <div class="grid2">
      <div>
        <label class="f">Nombre</label>
        <input class="in" name="nombre" required value="${esc(p.nombre)}" placeholder="Ej: Stickers troquelados">
      </div>
      <div>
        <label class="f">Categoría</label>
        <select class="in" name="cat">
          ${S.CATEGORIAS.map(c => `<option value="${c.slug}" ${c.slug===p.cat?"selected":""}>${esc(c.nombre)}</option>`).join("")}
        </select>
      </div>
    </div>
    <div class="grid3" style="margin-top:14px">
      <div>
        <label class="f">Precio (CLP)</label>
        <input class="in" name="precio" type="number" min="0" required value="${p.precio}">
        <p class="hint">Sin puntos: 24900</p>
      </div>
      <div>
        <label class="f">Precio anterior (opcional)</label>
        <input class="in" name="antes" type="number" min="0" value="${p.antes || ""}">
        <p class="hint">Muestra el % de descuento</p>
      </div>
      <div>
        <label class="f">Unidad</label>
        <input class="in" name="unidad" required value="${esc(p.unidad)}" placeholder="100 unidades · 5 × 5 cm">
      </div>
    </div>
    <div class="grid3" style="margin-top:14px">
      <div>
        <label class="f">Plazo de entrega</label>
        <input class="in" name="plazo" value="${esc(p.plazo)}" placeholder="3 a 5 días hábiles">
      </div>
      <div>
        <label class="f">Etiquetas</label>
        <input class="in" name="flags" value="${esc((p.flags||[]).join(', '))}" placeholder="Top ventas, Novedad">
        <p class="hint">Separadas por coma</p>
      </div>
      <div>
        <label class="f">Estrellas / opiniones</label>
        <div style="display:flex;gap:8px">
          <input class="in" name="rating" type="number" step="0.1" min="1" max="5" value="${p.rating}">
          <input class="in" name="reviews" type="number" min="0" value="${p.reviews}">
        </div>
      </div>
    </div>

    <div style="margin-top:14px">
      <label class="f">Foto</label>
      <div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">
        <img id="prevImg" src="${esc(p.img)}" style="width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--paper)" onerror="this.style.opacity=.25">
        <div style="flex:1;min-width:240px">
          <input class="in" name="img" id="campoImg" value="${esc(p.img)}" oninput="document.getElementById('prevImg').src=this.value"
                 placeholder="assets/img/fotos/mi-foto.jpg  ·  o una URL">
          <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
            <button type="button" class="btn btn--ghost btn--sm" onclick="ir('fotos')">Ir a mis fotos</button>
            ${S.BIBLIOTECA.length ? `<select class="in" style="max-width:260px" onchange="if(this.value){document.getElementById('campoImg').value=this.value;document.getElementById('prevImg').src=this.value}">
              <option value="">Elegir de mis fotos…</option>
              ${S.BIBLIOTECA.map(f => `<option value="${esc(f.ruta)}">${esc(f.nombre)}</option>`).join("")}
            </select>` : ""}
          </div>
        </div>
      </div>
    </div>

    <div style="margin-top:14px">
      <label class="f">Descripción</label>
      <textarea class="in" name="desc" required>${esc(p.desc)}</textarea>
    </div>
    <div style="margin-top:14px">
      <label class="f">Características (una por línea)</label>
      <textarea class="in" name="specs">${esc((p.specs||[]).join("\n"))}</textarea>
    </div>
    <div style="margin-top:14px">
      <label class="f">Identificador interno</label>
      <input class="in" name="id" value="${esc(p.id)}" placeholder="se genera solo con el nombre">
      <p class="hint">Solo cambialo si sabés lo que hacés: identifica el producto en el carrito.</p>
    </div>

    <div style="display:flex;gap:10px;margin-top:22px">
      <button class="btn btn--red" type="submit">Guardar producto</button>
      <button class="btn btn--ghost" type="button" onclick="edit=null;pintar()">Cancelar</button>
    </div>
  </form>`;
}

function guardarProducto(ev){
  ev.preventDefault();
  const f = new FormData(ev.target), g = k => (f.get(k) || "").toString().trim();
  const p = {
    id: g("id") || slug(g("nombre")),
    nombre: g("nombre"), cat: g("cat"),
    precio: +g("precio") || 0,
    unidad: g("unidad"), img: g("img"),
    flags: g("flags") ? g("flags").split(",").map(s => s.trim()).filter(Boolean) : [],
    rating: +g("rating") || 5, reviews: +g("reviews") || 0,
    desc: g("desc"),
    specs: g("specs") ? g("specs").split("\n").map(s => s.trim()).filter(Boolean) : [],
    plazo: g("plazo")
  };
  if(+g("antes") > 0) p.antes = +g("antes");
  if(edit === "nuevo") S.PRODUCTOS.push(p); else S.PRODUCTOS[edit] = p;
  guardar(); edit = null; pintar(); toast("Producto guardado");
  return false;
}
function mover(i, d){
  const j = i + d;
  if(j < 0 || j >= S.PRODUCTOS.length) return;
  [S.PRODUCTOS[i], S.PRODUCTOS[j]] = [S.PRODUCTOS[j], S.PRODUCTOS[i]];
  guardar(); pintar();
}
function duplicar(i){
  const c = clon(S.PRODUCTOS[i]);
  c.id += "-2"; c.nombre += " (copia)";
  S.PRODUCTOS.splice(i + 1, 0, c); guardar(); pintar();
}
function borrar(i){
  if(!confirm(`¿Eliminar «${S.PRODUCTOS[i].nombre}»?`)) return;
  S.PRODUCTOS.splice(i, 1); guardar(); pintar(); toast("Producto eliminado");
}

/* ============================================================
   CATEGORÍAS
   ============================================================ */
function vCategorias(){
  return `
  <div class="head">
    <div><h2>Categorías</h2><p class="muted" style="margin:4px 0 0">Se usan en los filtros del catálogo y en el pie de página</p></div>
    <span class="sep"></span>
    <button class="btn btn--red" onclick="nuevaCat()">+ Nueva</button>
  </div>
  ${S.CATEGORIAS.map((c,i) => `
    <div class="card">
      <div class="grid3">
        <div><label class="f">Nombre</label><input class="in" value="${esc(c.nombre)}" onchange="S.CATEGORIAS[${i}].nombre=this.value;guardar()"></div>
        <div><label class="f">Identificador</label><input class="in" value="${esc(c.slug)}" onchange="S.CATEGORIAS[${i}].slug=this.value;guardar()"></div>
        <div><label class="f">Foto</label><input class="in" value="${esc(c.img)}" onchange="S.CATEGORIAS[${i}].img=this.value;guardar()"></div>
      </div>
      <div style="margin-top:12px;display:flex;gap:12px;align-items:flex-end">
        <div style="flex:1"><label class="f">Descripción corta</label><input class="in" value="${esc(c.desc)}" onchange="S.CATEGORIAS[${i}].desc=this.value;guardar()"></div>
        <button class="ico del" onclick="if(confirm('¿Eliminar categoría?')){S.CATEGORIAS.splice(${i},1);guardar();pintar()}">🗑</button>
      </div>
    </div>`).join("")}`;
}
function nuevaCat(){
  S.CATEGORIAS.push({ slug:"nueva-" + Date.now().toString().slice(-4), nombre:"Nueva categoría", desc:"", img:"" });
  guardar(); pintar();
}

/* ============================================================
   FOTOS
   ============================================================ */
function vFotos(){
  return `
  <div class="head"><div><h2>Fotos</h2><p class="muted" style="margin:4px 0 0">Optimizá tus imágenes acá: se achican a 1400 px y se convierten a JPG liviano</p></div></div>

  <div class="card">
    <div class="drop" id="drop">
      <p style="margin:0 0 12px;font-weight:700">Arrastrá tus fotos acá</p>
      <p class="muted" style="margin:0 0 14px">o</p>
      <input type="file" id="fileFotos" accept="image/*" multiple hidden onchange="procesarFotos(this.files)">
      <button class="btn btn--red" onclick="document.getElementById('fileFotos').click()">Elegir archivos</button>
      <p class="hint" style="margin-top:12px">Se guardan en <code>assets/img/fotos/</code>. Con GitHub configurado se suben solas; si no, se descargan para que las subas a mano.</p>
    </div>
  </div>

  <div class="head" style="margin-top:26px"><h2 style="font-size:1.05rem">Mis fotos (${S.BIBLIOTECA.length})</h2></div>
  ${S.BIBLIOTECA.length ? `<div class="fotos">
    ${S.BIBLIOTECA.map((f,i) => `
      <figure class="foto" style="margin:0">

async function procesarFotos(files){
  const gh = ghCfg();
  for(const file of files){
    if(!file.type.startsWith("image/")) continue;
    const nombre = slug(file.name.replace(/\.[^.]+$/, "")) + ".jpg";
    const ruta   = "assets/img/fotos/" + nombre;
    const b64    = await comprimir(file);
    if(gh.token && gh.repo){
      try{
        await ghPut(ruta, b64, "Panel: foto " + nombre);
        toast("Subida a GitHub: " + nombre);
      }catch(e){ alert("No se pudo subir " + nombre + ": " + e.message); continue; }
    }else{
      const a = document.createElement("a");
      a.href = "data:image/jpeg;base64," + b64;
      a.download = nombre; a.click();
    }
    if(!S.BIBLIOTECA.some(f => f.ruta === ruta)) S.BIBLIOTECA.push({ nombre, ruta });
    guardar();
  }
  pintar();
  if(!ghCfg().token) toast("Fotos descargadas: subilas a assets/img/fotos/");
}

function comprimir(file, max = 1400, q = 0.82){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const e = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * e); c.height = Math.round(img.height * e);
        const x = c.getContext("2d");
        x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
        x.drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", q).split(",")[1]);
      };
      img.onerror = rej; img.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

/* Lee la configuración. Si el formulario está en pantalla, mandan sus valores:

function ghCfg(){
  let g = {};

function ghGuardar(aviso = true){

function ghOlvidar(){

/* Traduce los errores típicos de GitHub a algo accionable */
function ghError(status, mensaje){
  if(status === 401) return "Token inválido o vencido (GitHub: «" + mensaje + "»). Generá uno nuevo y pegalo de nuevo, completo y sin espacios.";
  if(status === 403) return "El token es válido pero no tiene permiso sobre este repositorio. Necesita «Contents: Read and write» (GitHub: «" + mensaje + "»).";
  if(status === 404) return "No encuentro el repositorio, o el token no lo tiene incluido en «Repository access». Revisá usuario y nombre exacto.";
  if(status === 409) return "El repositorio está vacío o la rama no existe todavía.";
  if(status === 422) return "GitHub rechazó los datos: " + mensaje;
  return "HTTP " + status + " — " + mensaje;
}
async function ghFetch(url, opts = {}){
  const c = ghCfg();
  if(!c.token) throw new Error("Falta el token. Pegalo en el campo «Token de acceso».");
  if(!c.usuario || !c.repo) throw new Error("Faltan el usuario o el nombre del repositorio.");
  let r;
  try{
    r = await fetch(url, {
      ...opts,
      headers: {
        Authorization: "Bearer " + c.token,
        Accept: "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28",
        ...(opts.headers || {})
      }
    });
  }catch(e){ throw new Error("Sin conexión con GitHub: " + e.message); }
  if(r.status === 404 && (opts.method || "GET") === "GET" && !opts.estricto) return null;
  const j = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(ghError(r.status, j.message || ""));
  return j;
}
async function ghApi(ruta, opts = {}){
  const c = ghCfg();
  return ghFetch(`https://api.github.com/repos/${c.usuario}/${c.repo}${ruta}`, opts);
}
async function ghPut(ruta, contenidoB64, mensaje){
  const c = ghCfg();
  const actual = await ghApi(`/contents/${ruta}?ref=${c.rama}`);
  return ghApi(`/contents/${ruta}`, {
    method:"PUT",
    body: JSON.stringify({
      message: mensaje, content: contenidoB64, branch: c.rama,
      ...(actual && actual.sha ? { sha: actual.sha } : {})
    })
  });
}
const b64txt = t => btoa(String.fromCharCode(...new TextEncoder().encode(t)));

}

async function probarConexion(){
  const c = ghCfg();
  document.getElementById("log").innerHTML = "";
  ghGuardar(false);

  log("Token recibido: " + (c.token ? c.token.slice(0,11) + "… (" + c.token.length + " caracteres)" : "VACÍO"));
  if(!c.token){ log("Pegá el token en el campo de arriba.", "err"); return; }
  if(!/^(github_pat_|ghp_)/.test(c.token))
    log("Ojo: no empieza con github_pat_ ni ghp_. ¿Copiaste el token completo?", "err");

  /* 1 · ¿el token existe y está vigente? */
  let quien = null;
  try{
    quien = await ghFetch("https://api.github.com/user", { estricto:true });
    log("Token válido — cuenta: " + quien.login, "ok");
  }catch(e){
    log(e.message, "err");
    log("Causas típicas: el token venció, fue revocado, o se copió cortado.");
    return;
  }

  /* 2 · ¿ve el repositorio? */
  try{
    const r = await ghApi("", { estricto:true });
    log("Repositorio encontrado: " + r.full_name + " (" + r.visibility + ")", "ok");
    if(quien.login.toLowerCase() !== c.usuario.toLowerCase())
      log("El token pertenece a «" + quien.login + "» pero el usuario configurado es «" + c.usuario + "».");
    if(r.permissions && r.permissions.push) log("Permiso de escritura: sí", "ok");
    else log("Permiso de escritura: NO. Editá el token y dale «Contents: Read and write».", "err");

    /* 3 · ¿existe la rama? */
    const ref = await ghApi("/git/ref/heads/" + c.rama);
    if(ref) log("Rama " + c.rama + " lista (" + ref.object.sha.slice(0,7) + ")", "ok");
    else log("La rama «" + c.rama + "» no existe en el repositorio.", "err");
  }catch(e){
    log(e.message, "err");
    log("Si el token es fine-grained, revisá que en «Repository access» esté incluido este repositorio.");
  }
}

/* ============================================================
   VERSIONES — publicar el sitio completo en GitHub
   ============================================================ */
let ARCHIVOS = [], DIFF = null;

const IGNORAR = [
  /^\.git\//, /^\.claude(\/|\.zip$)/, /^\.vscode\//, /^\.idea\//,
  /(^|\/)Thumbs\.db$/i, /(^|\/)desktop\.ini$/i, /(^|\/)\.DS_Store$/i,
  /\.(tmp|bak|swp)$/i, /(^|\/)bacano-respaldo-.*\.json$/i, /^_hoja\.html$/
];
const rutaRel = f => {
  const p = f.webkitRelativePath || f.name;
  return p.includes("/") ? p.split("/").slice(1).join("/") : p;
};
const kb = n => n < 1024 ? n + " B" : (n / 1024).toFixed(n < 102400 ? 1 : 0) + " KB";

async function sha1Git(buf){
  const cab  = new TextEncoder().encode("blob " + buf.byteLength + "\0");
  const todo = new Uint8Array(cab.length + buf.byteLength);
  todo.set(cab, 0); todo.set(new Uint8Array(buf), cab.length);
  const h = await crypto.subtle.digest("SHA-1", todo);
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join("");
}
function b64buf(buf){
  const b = new Uint8Array(buf); let s = "", t = 0x8000;
  for(let i = 0; i < b.length; i += t) s += String.fromCharCode.apply(null, b.subarray(i, i + t));
  return btoa(s);
}

async function leerCarpeta(files){
  const c = ghCfg();
  if(!c.token || !c.repo){ alert("Primero configurá la conexión en «Publicar contenido»."); return; }
  const el = document.getElementById("vLog");
  el.innerHTML = ""; log2("Leyendo carpeta…");
  ARCHIVOS = [];
  const lista = [...files].filter(f => { const p = rutaRel(f); return p && !IGNORAR.some(r => r.test(p)); });
  for(const f of lista){
    const buf = await f.arrayBuffer();
    ARCHIVOS.push({ ruta: rutaRel(f), buf, tam: f.size, sha: await sha1Git(buf) });
  }
  log2(ARCHIVOS.length + " archivos leídos", "ok");
  try{
    await compararGitHub();
    pintarDiff();
  }catch(e){ log2(e.message, "err"); }
}

async function compararGitHub(){
  const c = ghCfg();
  log2("Comparando con GitHub…");
  const ref    = await ghApi(`/git/ref/heads/${c.rama}`);
  if(!ref) throw new Error("No encuentro la rama " + c.rama + " en el repositorio.");
  const head   = ref.object.sha;
  const commit = await ghApi(`/git/commits/${head}`);
  const arbol  = await ghApi(`/git/trees/${commit.tree.sha}?recursive=1`);
  const remoto = new Map(arbol.tree.filter(t => t.type === "blob").map(t => [t.path, t.sha]));

  const nuevos = [], cambiados = [], iguales = [];
  ARCHIVOS.forEach(a => {
    if(!remoto.has(a.ruta)) nuevos.push(a);
    else if(remoto.get(a.ruta) !== a.sha) cambiados.push(a);
    else iguales.push(a);
    remoto.delete(a.ruta);
  });
  DIFF = { nuevos, cambiados, iguales, borrados: [...remoto.keys()], head, tree: commit.tree.sha };
  log2(`${nuevos.length} nuevos · ${cambiados.length} modificados · ${iguales.length} sin cambios · ${DIFF.borrados.length} solo en GitHub`, "ok");
}

function log2(msg, tipo){
  const l = document.getElementById("vLog");
  if(!l) return;
  l.innerHTML += (tipo === "ok" ? `<b>✓ ${msg}</b>` : tipo === "err" ? `<i>✕ ${msg}</i>` : `· ${msg}`) + "\n";
  l.scrollTop = l.scrollHeight;

async function publicarSitio(){
  const c = ghCfg();
  const btn = document.getElementById("btnVer");
  btn.disabled = true;
  const msg    = document.getElementById("vMsg").value.trim() || "Nueva versión del sitio";
  const tag    = document.getElementById("vTag").value.trim();
  const borrar = document.getElementById("vBorrar")?.checked;
  const usarPanel = document.getElementById("vPanel")?.checked;

  try{
    const subir = [...DIFF.cambiados, ...DIFF.nuevos];
    const arbol = [];

    for(const a of subir){
      let contenido;
      if(usarPanel && a.ruta === "assets/js/data.js"){
        contenido = b64txt(generarData());
        log2("data.js → contenido del panel");
      }else{
        contenido = b64buf(a.buf);
      }
      const blob = await ghApi("/git/blobs", { method:"POST", body: JSON.stringify({ content: contenido, encoding:"base64" }) });
      arbol.push({ path: a.ruta, mode:"100644", type:"blob", sha: blob.sha });
      log2("subido " + a.ruta);
    }

    /* si el panel tiene cambios y data.js no estaba entre los modificados, se agrega igual */
    if(usarPanel && !subir.some(a => a.ruta === "assets/js/data.js")){
      const blob = await ghApi("/git/blobs", { method:"POST", body: JSON.stringify({ content: b64txt(generarData()), encoding:"base64" }) });
      arbol.push({ path:"assets/js/data.js", mode:"100644", type:"blob", sha: blob.sha });
      log2("subido assets/js/data.js (contenido del panel)");
    }

    if(borrar) DIFF.borrados.forEach(p => arbol.push({ path:p, mode:"100644", type:"blob", sha:null }));

    if(!arbol.length){ log2("No hay nada que publicar.", "err"); btn.disabled = false; return; }

    log2("Armando la versión…");
    const nuevoArbol = await ghApi("/git/trees", { method:"POST", body: JSON.stringify({ base_tree: DIFF.tree, tree: arbol }) });
    const commit     = await ghApi("/git/commits", { method:"POST", body: JSON.stringify({ message: msg, tree: nuevoArbol.sha, parents:[DIFF.head] }) });
    await ghApi(`/git/refs/heads/${c.rama}`, { method:"PATCH", body: JSON.stringify({ sha: commit.sha }) });
    log2("Versión publicada: " + commit.sha.slice(0,7) + " — " + msg, "ok");

    if(tag){
      await ghApi("/git/refs", { method:"POST", body: JSON.stringify({ ref:"refs/tags/" + tag, sha: commit.sha }) });
      log2("Etiqueta " + tag + " creada", "ok");
    }

    sucio = false; estado();
    log2("GitHub Pages tarda entre 30 s y 2 min en mostrar los cambios.");
    toast("¡Versión publicada!");
    DIFF = null; ARCHIVOS = [];
    document.getElementById("vDiff").innerHTML =
      `<div class="card"><p style="margin:0">Versión <b>${commit.sha.slice(0,7)}</b> publicada. Volvé a elegir la carpeta si hacés más cambios.</p></div>`;
    cargarHistorial();
  }catch(e){
    log2(e.message, "err");
    if(/permiso|403|Read and write/i.test(e.message)){
      log2("Abrí el token en GitHub → Permissions → Repository permissions → Contents → «Read and write» → «Update token».");
      log2("El token sigue siendo el mismo: alcanza con recargar esta página.");
    }
    if(/not fast forward|is at/i.test(e.message)) log2("Alguien más publicó mientras editabas: volvé a elegir la carpeta para comparar de nuevo.");
    btn.disabled = false;
  }
}

async function restaurar(sha){
  if(!confirm("Se publica una versión nueva con el contenido de " + sha.slice(0,7) + ".\nNo se borra nada del historial. ¿Seguir?")) return;
  const c = ghCfg();
  try{
    const viejo = await ghApi(`/git/commits/${sha}`);
    const ref   = await ghApi(`/git/ref/heads/${c.rama}`);
    const nuevo = await ghApi("/git/commits", { method:"POST", body: JSON.stringify({
      message: "Restaura la versión " + sha.slice(0,7), tree: viejo.tree.sha, parents: [ref.object.sha]
    })});
    await ghApi(`/git/refs/heads/${c.rama}`, { method:"PATCH", body: JSON.stringify({ sha: nuevo.sha }) });
    toast("Versión restaurada");
    cargarHistorial();
  }catch(e){ alert("No se pudo restaurar: " + e.message); }
}

async function api(accion, datos){
  const o = { headers: { "X-Bacano":"1" } };
  if(datos !== undefined){
    o.method = "POST";
    o.headers["Content-Type"] = "application/json";
    o.body = JSON.stringify(datos);
  }
  let r;
  try{ r = await fetch("api.php?accion=" + accion, o); }
  catch(e){ throw new Error("No se pudo contactar api.php: " + e.message); }
  const txt = await r.text();
  let j;
  try{ j = JSON.parse(txt); }
  catch(e){
    throw new Error("El servidor no ejecutó api.php. Esto funciona solo con el sitio subido a un hosting con PHP, no abriendo el archivo desde tu PC.");
  }
  if(!j.ok) throw new Error(j.error || ("Error " + r.status));
  return j;
}

document.addEventListener("dragover", e => {
  const d = document.getElementById("drop");
  if(d){ e.preventDefault(); d.classList.add("over"); }
});
document.addEventListener("dragleave", () => document.getElementById("drop")?.classList.remove("over"));
document.addEventListener("drop", e => {
  const d = document.getElementById("drop");
  if(!d) return;
  e.preventDefault(); d.classList.remove("over");
  if(e.dataTransfer.files.length) procesarFotos(e.dataTransfer.files);
});
window.addEventListener("beforeunload", e => { if(sucio){ e.preventDefault(); e.returnValue = ""; } });
